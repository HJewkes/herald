name: CI

on:
  push:
    branches: [main]
  # Unfiltered so `check` reports on every PR, whatever it targets; a filtered-out required check blocks the merge.
  pull_request:

permissions:
  contents: read

# Rename stage (a) of the HJewkes/ci standard: the ruleset still requires gitleaks,
# security-audit, lint, test and build, so those jobs keep their names until it
# requires only `check`. A later PR replaces them with node.yml. The codecov upload lives in coverage.yml.
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
      - run: npm audit --audit-level=critical

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # verify is format, lint, typecheck, build and tests: the same gate as a local run.
      - run: npm run verify

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx vitest run --coverage

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Verify build output
        run: test -f dist/cli.js || (echo "Build output missing" && exit 1)

  # The aggregator the ruleset will require; all-green also fails if a job here is missing from needs.
  check:
    if: always()
    needs: [gitleaks, security-audit, lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: HJewkes/ci/actions/all-green@v1
        with:
          needs: ${{ toJSON(needs) }}
